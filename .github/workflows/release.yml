name: Release

# A tag such as v1.0.0 or v1.0.0-rc.1 whose number equals the version in rust/app/Cargo.toml
# publishes a release with the executable, its installer, their SHA-256 sums and the
# third-party notices. A tag
# with a suffix (-rc.1) makes a pre-release.
#
# Nothing is built here: the executable and the installer are the HomeLink artifact of the
# successful CI run of the tagged commit, the same files that were tested by hand. Tag a commit whose CI has passed, within
# the 14 days the artifact is kept.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    env:
      SIZE_BUDGET: 16777216
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against the package version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $version = (Select-String -Path rust/app/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
              Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tag -ne $version) {
            Write-Error "Tag '$env:GITHUB_REF_NAME' does not match the version '$version' in rust/app/Cargo.toml."
          }

      - name: Licence policy and third-party notices
        run: python tools/third_party_notices.py --check

      - name: Take the HomeLink artifact of the CI run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $run = gh run list --workflow ci.yml --commit $env:GITHUB_SHA --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if (-not $run) {
            Write-Error "No successful CI run for $env:GITHUB_SHA. Wait until CI of this commit passes, then re-run this job."
          }
          "CI run $run"
          gh run download $run --name HomeLink --dir dist
          if (-not (Test-Path dist/HomeLink.exe) -or -not (Test-Path dist/HomeLink.msi)) {
            Write-Error "The CI run $run has no complete HomeLink artifact (it is kept 14 days)."
          }

      - name: Size budget and smoke run
        shell: pwsh
        run: tools/smoke.ps1 -Exe dist/HomeLink.exe -Config rust/app/config.example.toml -Budget $env:SIZE_BUDGET

      - name: Collect the files
        shell: pwsh
        run: |
          Copy-Item THIRD-PARTY-NOTICES.txt dist/
          $lines = foreach ($name in 'HomeLink.exe', 'HomeLink.msi') {
            $hash = (Get-FileHash -Algorithm SHA256 "dist/$name").Hash.ToLower()
            "$hash *$name"
          }
          $lines | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $flags = @('--generate-notes', '--verify-tag', '--title', $env:GITHUB_REF_NAME)
          if ($env:GITHUB_REF_NAME -match '-') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME dist/HomeLink.msi dist/HomeLink.exe dist/SHA256SUMS.txt dist/THIRD-PARTY-NOTICES.txt @flags
