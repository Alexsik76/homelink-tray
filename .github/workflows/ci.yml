name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev,build]"

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Test
        run: python -m pytest -q

      - name: Build executable
        run: >
          python -m PyInstaller --noconfirm --onefile --noconsole --name HomeLink
          --icon src\homelink\assets\app.ico --uac-admin --paths src
          --add-data "src\homelink\assets;homelink\assets"
          --add-data "src\homelink\locales;homelink\locales"
          --add-data "src\homelink\config.example.json;homelink"
          run_homelink.pyw

      - uses: actions/upload-artifact@v7
        with:
          name: HomeLink
          path: dist/HomeLink.exe
          retention-days: 14
          if-no-files-found: error

  rust-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-core-${{ hashFiles('rust/Cargo.lock') }}

      - name: Format check
        run: cargo fmt -p homelink-core --check

      - name: Lint
        run: cargo clippy -p homelink-core --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test -p homelink-core --all-features

  rust-app:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-app-${{ hashFiles('rust/Cargo.lock') }}

      - name: Format check
        run: cargo fmt -p homelink --check

      - name: Lint
        run: cargo clippy -p homelink --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test -p homelink --all-features --locked

      - name: Build
        run: cargo build -p homelink --release --locked --features demo

      - uses: actions/upload-artifact@v7
        with:
          name: HomeLink-rust-demo
          path: rust/target/release/HomeLink.exe
          retention-days: 14
          if-no-files-found: error
