name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev,build]"

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Test
        run: python -m pytest -q

      - name: Build executable
        run: >
          python -m PyInstaller --noconfirm --onefile --noconsole --name HomeLink
          --icon src\homelink\assets\app.ico --uac-admin --paths src
          --add-data "src\homelink\assets;homelink\assets"
          --add-data "src\homelink\locales;homelink\locales"
          --add-data "src\homelink\config.example.json;homelink"
          run_homelink.pyw

      - uses: actions/upload-artifact@v7
        with:
          name: HomeLink
          path: dist/HomeLink.exe
          retention-days: 14
          if-no-files-found: error
