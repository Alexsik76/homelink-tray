[package]
name = "homelink-core"
version = "0.1.0"
edition = "2024"
description = "Platform-independent core of HomeLink: domain model, configuration, notices, i18n"
publish = false

[features]
# Fakes for tests, also usable from the app crate's tests.
testing = []

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml_edit = { version = "0.25.19", features = ["serde"] }

[lints]
workspace = true

[[test]]
name = "controller_parity"
required-features = ["testing"]

[[test]]
name = "multi_pc"
required-features = ["testing"]

[[test]]
name = "engine"
required-features = ["testing"]
