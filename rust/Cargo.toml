[workspace]
members = ["core"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[package]
name = "homelink"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-software", "system-tray", "compat-1-2", "unstable-winit-030"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.18"
