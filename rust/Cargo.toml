[workspace]
members = ["core", "app"]
resolver = "3"

[workspace.lints.rust]
# `deny`, not `forbid`: the app crate needs a few Windows calls, and `forbid` cannot be
# overridden by `allow`. Only one cfg(windows) module of `app` may use unsafe code.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
panic = "unwind"
