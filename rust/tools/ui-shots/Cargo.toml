# Renders windows of HomeLink without a display, to PNG files, to look at layouts (not a part
# of the workspace; see README.md).
[package]
name = "ui-shots"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "renderer-software", "compat-1-2", "image-default-formats"] }
i-slint-core = { version = "=1.18.1", features = ["image-decoders"] }
homelink-core = { path = "../../core" }

[build-dependencies]
slint-build = "=1.18.1"
